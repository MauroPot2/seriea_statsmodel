name: xG source verification
on:
  push:
    branches: ['feat/xg-elo-model']
  workflow_dispatch:
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements_seriea.txt
      - name: Verify xG source formats
        run: |
          python - <<'PY'
          import pandas as pd
          urls = [
            'https://www.xgtables.io/history/serie-a/2024/fixtures.csv',
            'https://www.xgtables.io/history/serie-a/2025/fixtures.csv',
            'https://www.xgtables.io/data/v1/serie-a/2026/fixtures.csv',
          ]
          for url in urls:
              print('SOURCE:',url, flush=True)
              try:
                  frame=pd.read_csv(url, nrows=3)
                  print('COLUMNS:',list(frame.columns),flush=True)
                  print('ROWS:',frame.to_json(orient='records'), flush=True)
              except Exception as exc:
                  print('FETCH_ERROR:',repr(exc),flush=True)
          PY
